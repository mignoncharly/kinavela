# See deploy/nginx.conf — this bootstrap config is installed to the same path,
# so the two are never loaded together.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kinavela.com www.kinavela.com;

    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    access_log /var/log/nginx/kinavela.access.log;
    error_log /var/log/nginx/kinavela.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kinavela-certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
