server {
    listen 80;
    listen [::]:80;
    server_name kinavela.gestionatech.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kinavela-certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kinavela.gestionatech.de;

    ssl_certificate /etc/letsencrypt/live/kinavela.gestionatech.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinavela.gestionatech.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kinavela.access.log;
    error_log /var/log/nginx/kinavela.error.log warn;

    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;


    location ~ /\.(?!well-known).* {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Powered-By;
    }

}
