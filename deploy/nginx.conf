# Only send "Connection: upgrade" for actual WebSocket handshakes; plain
# requests must get "Connection: close" instead of a bogus upgrade hint.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kinavela.com www.kinavela.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kinavela-certbot;
        default_type "text/plain";
    }

    # Canonicalise scheme and host in one hop rather than preserving $host,
    # which would leave non-www visitors on the non-canonical hostname.
    location / {
        return 301 https://www.kinavela.com$request_uri;
    }
}

# Non-www over TLS. Without this the apex served the full site at 200 alongside
# www, leaving two crawlable copies of every page held together only by the
# canonical tag. The certificate covers both names, so the handshake completes
# before the redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kinavela.com;

    ssl_certificate /etc/letsencrypt/live/www.kinavela.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kinavela.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.kinavela.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kinavela.com;

    ssl_certificate /etc/letsencrypt/live/www.kinavela.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kinavela.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kinavela.access.log;
    error_log /var/log/nginx/kinavela.error.log warn;

    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Auth callbacks emit a ~4.1 KB header block: the Supabase session cookie
    # alone is ~2.8 KB, plus the CSP header. That overflows nginx's default
    # 4 KB proxy_buffer_size and turns /auth/confirm into a 502.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;


    location ~ /\.(?!well-known).* {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Powered-By;
    }

}
