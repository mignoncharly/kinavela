name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key-not-a-real-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3020
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-not-a-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SMTP_HOST: smtp.zoho.eu
      SMTP_PORT: 465
      SMTP_SECURE: true
      SMTP_USER: contact@kinavela.com
      SMTP_PASSWORD: ci-password-placeholder
      EMAIL_FROM: Kinavela <contact@kinavela.com>
      EMAIL_REPLY_TO: contact@kinavela.com
      EVENT_REMINDER_CRON_SECRET: ci-event-reminder-secret-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run env:check
      - run: npm run security:scan
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
